<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube PiP</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img class="logo" src="../../icons/icon48.png" alt="" width="32" height="32">
    <div>
      <h1 data-i18n="extName"></h1>
      <p data-i18n="popupSubtitle"></p>
    </div>
  </header>

  <section>
    <h2 data-i18n="buttonStyle"></h2>
    <div class="styles" id="styles" role="radiogroup"></div>
  </section>

  <section>
    <h2 data-i18n="seekStep"></h2>
    <div class="segmented" id="seek" role="radiogroup"></div>
  </section>

  <section class="toggles">
    <label class="toggle">
      <span class="toggle-text">
        <span data-i18n="hotkey"></span>
        <small data-i18n="hotkeyHint"></small>
      </span>
      <input type="checkbox" id="hotkey">
      <span class="switch" aria-hidden="true"></span>
    </label>
    <label class="toggle">
      <span class="toggle-text">
        <span data-i18n="autoPip"></span>
        <small data-i18n="autoPipHint"></small>
      </span>
      <input type="checkbox" id="autoPip">
      <span class="switch" aria-hidden="true"></span>
    </label>
  </section>

  <section class="toggles">
    <h2 data-i18n="fullscreenApps"></h2>
    <label class="toggle">
      <span class="toggle-text">
        <span data-i18n="pauseWhenHidden"></span>
        <small data-i18n="pauseWhenHiddenHint"></small>
      </span>
      <input type="checkbox" id="pauseWhenHidden">
      <span class="switch" aria-hidden="true"></span>
    </label>
    <p class="note" data-i18n="fullscreenAppsNote"></p>
  </section>

  <footer>
    <span data-i18n="footer"></span>
    <a class="brand" href="https://github.com/lastref/mssoft-youtube-pip" target="_blank" rel="noopener noreferrer">MSSoft</a>
  </footer>

  <script src="../content/shared.js"></script>
  <script src="../content/icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
