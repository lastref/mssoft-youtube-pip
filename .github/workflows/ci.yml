name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and manifest checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check every script
        run: |
          for f in $(git ls-files 'src/**/*.js' 'test/*.js'); do node --check "$f"; done
      - name: Run tests
        run: npm test
      - name: Build unpacked zip
        run: node scripts/package.js
      - uses: actions/upload-artifact@v4
        with:
          name: mssoft-youtube-pip
          path: dist/*.zip
          if-no-files-found: error
